  },
  {
    title: '気圧・注記スタンプ',
    tools: [
      { id: 'stamp_high', label: '高気圧', icon: <HighStampIcon /> },
      { id: 'stamp_low', label: '低気圧', icon: <LowStampIcon /> },
      { id: 'stamp_typhoon', label: '台風', icon: <TyphoonStampIcon /> },
      { id: 'stamp_td', label: '熱帯低気圧', icon: <span className="text-xs font-bold text-sky-600">熱</span> },
      { id: 'text', label: '文字メモ', icon: <UiIcon name="type" /> },
    ],
  },
  {
    title: '天気イラストスタンプ',
    tools: [
      { id: 'stamp_sunny', label: '晴れ', icon: <SunnyStampIcon /> },
      { id: 'stamp_partly', label: '晴時々曇', icon: <PartlyCloudyStampIcon /> },
      { id: 'stamp_cloudy', label: 'くもり', icon: <CloudyStampIcon /> },
      { id: 'stamp_rain', label: '雨', icon: <RainStampIcon /> },
      { id: 'stamp_snow', label: '雪', icon: <SnowStampIcon /> },
      { id: 'stamp_thunder', label: '雷', icon: <ThunderStampIcon /> },
    ],
  },
];

const QUICK_PRESSURES = ['992', '996', '1000', '1004', '1008', '1012', '1016', '1020', '1024'];
const QUICK_MOVEMENTS = ['ゆっくり', 'ほとんど停滞', '東 25km/h', '北東 35km/h', '北 20km/h'];
const PEN_COLORS = ['#0F172A', '#DC2626', '#2563EB', '#059669', '#D97706', '#7C3AED'];

const SelectedStrokeEditor = ({ item, onChange }) => {
  const isFront = item.kind === 'warm_front' || item.kind === 'cold_front' || item.kind === 'stationary_front' || item.kind === 'occluded_front';
  return (
    <div className="space-y-3">
      {item.kind === 'isobar' && (
        <>
          <div>
            <label className="block text-xs font-medium text-slate-700 mb-1">気圧値ラベル (hPa)</label>
            <input
              type="text" value={item.pressureLabel ?? ''}
              onChange={(e) => onChange({ pressureLabel: e.target.value })}
              placeholder="空欄で非表示"
              className="w-full px-2.5 py-1.5 text-sm font-mono-tabular border border-slate-200 rounded focus:outline-none focus:border-sky-500"
            />
          </div>
          <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-md">
            <button type="button" onClick={() => onChange({ lineStyle: 'solid' })} className={`py-1 text-xs font-medium rounded ${item.lineStyle === 'solid' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>実線</button>
            <button type="button" onClick={() => onChange({ lineStyle: 'dashed' })} className={`py-1 text-xs font-medium rounded ${item.lineStyle === 'dashed' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>破線</button>
          </div>
        </>
      )}
      {isFront && (
        <button type="button" onClick={() => onChange({ flipSide: !item.flipSide })} className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-md border border-slate-200 bg-white hover:bg-slate-50 text-xs font-semibold text-slate-700">
          <UiIcon name="arrowLeftRight" className="w-3.5 h-3.5" /><span>前線の向きを反転</span>
        </button>
      )}
      <div>
        <div className="flex justify-between text-xs text-slate-600 mb-1">
          <span>線の太さ</span><span className="font-mono-tabular">{item.strokeWidth.toFixed(1)} px</span>
        </div>
        <input type="range" min={1.2} max={5} step={0.2} value={item.strokeWidth} onChange={(e) => onChange({ strokeWidth: Number(e.target.value) })} className="w-full accent-sky-700" />
      </div>
    </div>
  );
};

const SelectedStampEditor = ({ item, onChange }) => (
  <div className="space-y-3">
    {item.kind === 'text' ? (
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">テキスト内容</label>
        <input type="text" value={item.text ?? ''} onChange={(e) => onChange({ text: e.target.value })} className="w-full px-2.5 py-1.5 text-sm border border-slate-200 rounded focus:outline-none focus:border-sky-500" />
      </div>
    ) : item.kind.startsWith('weather_') ? (
      <div>
        <label className="block text-xs font-medium text-slate-700 mb-1">添えるラベル（任意）</label>
        <input type="text" value={item.text ?? ''} onChange={(e) => onChange({ text: e.target.value })} placeholder="例: 22℃ / 大雨" className="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded focus:outline-none focus:border-sky-500" />
      </div>
    ) : (
      <>
        <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-md">
          <button type="button" onClick={() => onChange({ labelStyle: 'ja' })} className={`py-1 text-xs font-medium rounded ${item.labelStyle === 'ja' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>日本語 (高/低)</button>
          <button type="button" onClick={() => onChange({ labelStyle: 'en' })} className={`py-1 text-xs font-medium rounded ${item.labelStyle === 'en' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>英語 (H/L)</button>
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">中心気圧 (hPa)</label>
          <input type="text" value={item.pressure ?? ''} onChange={(e) => onChange({ pressure: e.target.value })} className="w-full px-2.5 py-1.5 text-sm font-mono-tabular border border-slate-200 rounded focus:outline-none focus:border-sky-500" />
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-700 mb-1">移動・速度</label>
          <input type="text" value={item.movementText ?? ''} onChange={(e) => onChange({ movementText: e.target.value })} className="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded focus:outline-none focus:border-sky-500" />
        </div>
      </>
    )}
    <div>
      <div className="flex justify-between text-xs text-slate-600 mb-1">
        <span>サイズ倍率</span><span className="font-mono-tabular">{item.scale.toFixed(2)}x</span>
      </div>
      <input type="range" min={0.6} max={1.8} step={0.05} value={item.scale} onChange={(e) => onChange({ scale: Number(e.target.value) })} className="w-full accent-sky-700" />
    </div>
  </div>
);

const ToolSidebar = ({ activeTool, onSelectTool, settings, onChangeSettings, selectedItem, onUpdateSelectedItem, onDeleteSelectedItem }) => {
  const isFrontTool = activeTool === 'warm_front' || activeTool === 'cold_front' || activeTool === 'stationary_front' || activeTool === 'occluded_front';
  const isStampTool = activeTool === 'stamp_high' || activeTool === 'stamp_low' || activeTool === 'stamp_typhoon' || activeTool === 'stamp_td';
  const isWeatherIconTool = activeTool === 'stamp_sunny' || activeTool === 'stamp_cloudy' || activeTool === 'stamp_partly' || activeTool === 'stamp_rain' || activeTool === 'stamp_snow' || activeTool === 'stamp_thunder';

  const adjustPressureValue = (current, delta) => {
    const num = parseInt(current, 10);
    return Number.isNaN(num) ? String(1012 + delta) : String(num + delta);
  };

  return (
    <aside className="w-72 shrink-0 bg-white border-r border-slate-200 flex flex-col h-full overflow-y-auto">
      <div className="p-4 space-y-4 border-b border-slate-200">
        {TOOL_GROUPS.map((group) => (
          <div key={group.title}>
            <div className="text-xs font-semibold text-slate-500 mb-2">{group.title}</div>
            <div className="grid grid-cols-2 gap-1.5">
              {group.tools.map((t) => (
                <button
                  key={t.id} type="button" onClick={() => onSelectTool(t.id)}
                  className={`flex items-center gap-2 px-2.5 py-2 rounded-md border text-xs font-medium transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-sky-600 ${
                    activeTool === t.id ? 'bg-sky-50 border-sky-400 text-sky-900' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50 hover:border-slate-300'
                  }`}
                >
                  <span className="shrink-0 flex items-center justify-center w-4 h-4">{t.icon}</span>
                  <span className="truncate">{t.label}</span>
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="p-4 space-y-4 flex-1">
        {selectedItem && activeTool === 'select' ? (
          <div className="space-y-4">
            <div className="flex items-center justify-between">
              <span className="text-xs font-semibold text-slate-900">選択中のオブジェクト編集</span>
              <button type="button" onClick={onDeleteSelectedItem} className="flex items-center gap-1 px-2 py-1 text-xs font-medium text-rose-700 hover:bg-rose-50 rounded border border-rose-200 transition-colors whitespace-nowrap shrink-0">
                <UiIcon name="trash" className="w-3.5 h-3.5" /><span>削除</span>
              </button>
            </div>
            {selectedItem.itemType === 'stroke' && <SelectedStrokeEditor item={selectedItem} onChange={(patch) => onUpdateSelectedItem((prev) => ({ ...prev, ...patch }))} />}
            {selectedItem.itemType === 'stamp' && <SelectedStampEditor item={selectedItem} onChange={(patch) => onUpdateSelectedItem((prev) => ({ ...prev, ...patch }))} />}
          </div>
        ) : (
          <div className="space-y-4">
            <div className="text-xs font-semibold text-slate-900">ツール詳細設定</div>

            {activeTool === 'select' && (
              <p className="text-xs text-slate-500 leading-relaxed">地図上の等圧線・前線・スタンプをクリックして選択し、ドラッグで移動やプロパティの編集ができます。</p>
            )}

            {activeTool === 'eraser' && (
              <div className="space-y-3">
                <p className="text-xs text-slate-500 leading-relaxed">消したい線やスタンプの上をなぞるかクリックして削除します。</p>
                <div>
                  <div className="flex justify-between text-xs text-slate-600 mb-1"><span>消しゴム半径</span><span className="font-mono-tabular">{settings.eraserRadius} px</span></div>
                  <input type="range" min={8} max={40} step={2} value={settings.eraserRadius} onChange={(e) => onChangeSettings({ eraserRadius: Number(e.target.value) })} className="w-full accent-sky-700" />
                </div>
              </div>
            )}

            {activeTool === 'isobar' && (
              <div className="space-y-3.5">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-medium text-slate-700">気圧値を表示 (hPa)</label>
                  <input type="checkbox" checked={settings.showIsobarLabel} onChange={(e) => onChangeSettings({ showIsobarLabel: e.target.checked })} className="w-4 h-4 accent-sky-700 rounded" />
                </div>
                {settings.showIsobarLabel && (
                  <div className="space-y-2">
                    <div className="flex items-center gap-1.5">
                      <button type="button" onClick={() => onChangeSettings({ isobarPressure: adjustPressureValue(settings.isobarPressure, -4) })} className="p-1.5 border border-slate-200 rounded hover:bg-slate-50 text-slate-600" title="-4 hPa">
                        <UiIcon name="minus" className="w-3.5 h-3.5" />
                      </button>
                      <input type="text" value={settings.isobarPressure} onChange={(e) => onChangeSettings({ isobarPressure: e.target.value })} placeholder="1012" className="flex-1 px-2.5 py-1.5 text-sm font-mono-tabular border border-slate-200 rounded focus:outline-none focus:border-sky-500" />
                      <button type="button" onClick={() => onChangeSettings({ isobarPressure: adjustPressureValue(settings.isobarPressure, 4) })} className="p-1.5 border border-slate-200 rounded hover:bg-slate-50 text-slate-600" title="+4 hPa">
                        <UiIcon name="plus" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                    <div className="grid grid-cols-3 gap-1">
                      {QUICK_PRESSURES.map((val) => (
                        <button key={val} type="button" onClick={() => onChangeSettings({ isobarPressure: val })} className={`py-1 text-xs font-mono-tabular rounded border transition-colors ${settings.isobarPressure === val ? 'bg-sky-50 border-sky-400 text-sky-900 font-semibold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>{val}</button>
                      ))}
                    </div>
                  </div>
                )}
                <div>
                  <div className="text-xs font-medium text-slate-700 mb-1.5">線種</div>
                  <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-md">
                    <button type="button" onClick={() => onChangeSettings({ lineStyle: 'solid' })} className={`py-1 text-xs font-medium rounded transition-colors ${settings.lineStyle === 'solid' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>実線 (4hPa)</button>
                    <button type="button" onClick={() => onChangeSettings({ lineStyle: 'dashed' })} className={`py-1 text-xs font-medium rounded transition-colors ${settings.lineStyle === 'dashed' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>破線 (2hPa)</button>
                  </div>
                </div>
                <div>
                  <div className="flex justify-between text-xs text-slate-600 mb-1"><span>線の太さ</span><span className="font-mono-tabular">{settings.strokeWidth.toFixed(1)} px</span></div>
                  <input type="range" min={1.2} max={4.5} step={0.2} value={settings.strokeWidth} onChange={(e) => onChangeSettings({ strokeWidth: Number(e.target.value) })} className="w-full accent-sky-700" />
                </div>
              </div>
            )}

            {isFrontTool && (
              <div className="space-y-3.5">
                <p className="text-xs text-slate-500 leading-relaxed">ドラッグして前線を描画します。半円や三角の向きが逆の場合は反転できます。</p>
                <button type="button" onClick={() => onChangeSettings({ flipFrontSide: !settings.flipFrontSide })} className={`w-full flex items-center justify-center gap-2 py-2 px-3 rounded-md border text-xs font-semibold transition-colors ${settings.flipFrontSide ? 'bg-sky-50 border-sky-400 text-sky-900' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}`}>
                  <UiIcon name="arrowLeftRight" className="w-3.5 h-3.5" /><span>記号の向きを反転</span>
                </button>
                <div>
                  <div className="flex justify-between text-xs text-slate-600 mb-1"><span>記号サイズ</span><span className="font-mono-tabular">{settings.symbolSize} px</span></div>
                  <input type="range" min={5} max={14} step={1} value={settings.symbolSize} onChange={(e) => onChangeSettings({ symbolSize: Number(e.target.value) })} className="w-full accent-sky-700" />
                </div>
                <div>
                  <div className="flex justify-between text-xs text-slate-600 mb-1"><span>記号の間隔</span><span className="font-mono-tabular">{settings.symbolSpacing} px</span></div>
                  <input type="range" min={20} max={52} step={2} value={settings.symbolSpacing} onChange={(e) => onChangeSettings({ symbolSpacing: Number(e.target.value) })} className="w-full accent-sky-700" />
                </div>
              </div>
            )}

            {(activeTool === 'trough' || activeTool === 'arrow' || activeTool === 'pen') && (
              <div className="space-y-3.5">
                <div>
                  <div className="text-xs font-medium text-slate-700 mb-1.5">線の色</div>
                  <div className="flex items-center gap-2">
                    {PEN_COLORS.map((c) => (
                      <button key={c} type="button" onClick={() => onChangeSettings({ penColor: c })} className={`w-6 h-6 rounded-full border transition-transform ${settings.penColor === c ? 'scale-110 ring-2 ring-sky-500 ring-offset-1 border-white' : 'border-slate-300'}`} style={{ backgroundColor: c }} aria-label={`Color ${c}`} />
                    ))}
                  </div>
                </div>
                {activeTool !== 'trough' && (
                  <div>
                    <div className="text-xs font-medium text-slate-700 mb-1.5">線種</div>
                    <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-md">
                      <button type="button" onClick={() => onChangeSettings({ lineStyle: 'solid' })} className={`py-1 text-xs font-medium rounded transition-colors ${settings.lineStyle === 'solid' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>実線</button>
                      <button type="button" onClick={() => onChangeSettings({ lineStyle: 'dashed' })} className={`py-1 text-xs font-medium rounded transition-colors ${settings.lineStyle === 'dashed' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>破線</button>
                    </div>
                  </div>
                )}
                <div>
                  <div className="flex justify-between text-xs text-slate-600 mb-1"><span>線の太さ</span><span className="font-mono-tabular">{settings.strokeWidth.toFixed(1)} px</span></div>
                  <input type="range" min={1.4} max={5} step={0.2} value={settings.strokeWidth} onChange={(e) => onChangeSettings({ strokeWidth: Number(e.target.value) })} className="w-full accent-sky-700" />
                </div>
              </div>
            )}

            {isStampTool && (
              <div className="space-y-3.5">
                <p className="text-xs text-slate-500 leading-relaxed">地図上の配置したい地点をクリックしてスタンプを貼り付けます。</p>
                <div>
                  <div className="text-xs font-medium text-slate-700 mb-1.5">記号の表記</div>
                  <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-md">
                    <button type="button" onClick={() => onChangeSettings({ stampLabelStyle: 'ja' })} className={`py-1 text-xs font-medium rounded transition-colors ${settings.stampLabelStyle === 'ja' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>高 / 低 / 台</button>
                    <button type="button" onClick={() => onChangeSettings({ stampLabelStyle: 'en' })} className={`py-1 text-xs font-medium rounded transition-colors ${settings.stampLabelStyle === 'en' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>H / L / T</button>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">中心気圧 (hPa・任意)</label>
                  <div className="flex items-center gap-1.5">
                    <button type="button" onClick={() => onChangeSettings({ stampPressure: adjustPressureValue(settings.stampPressure || '1000', -2) })} className="p-1.5 border border-slate-200 rounded hover:bg-slate-50 text-slate-600">
                      <UiIcon name="minus" className="w-3.5 h-3.5" />
                    </button>
                    <input type="text" value={settings.stampPressure} onChange={(e) => onChangeSettings({ stampPressure: e.target.value })} placeholder="例: 1024" className="flex-1 px-2.5 py-1.5 text-sm font-mono-tabular border border-slate-200 rounded focus:outline-none focus:border-sky-500" />
                    <button type="button" onClick={() => onChangeSettings({ stampPressure: adjustPressureValue(settings.stampPressure || '1000', 2) })} className="p-1.5 border border-slate-200 rounded hover:bg-slate-50 text-slate-600">
                      <UiIcon name="plus" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">移動方向・速度 (任意)</label>
                  <input type="text" value={settings.stampMovement} onChange={(e) => onChangeSettings({ stampMovement: e.target.value })} placeholder="例: 北東 30km/h" className="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded focus:outline-none focus:border-sky-500 mb-1.5" />
                  <div className="flex flex-wrap gap-1">
                    {QUICK_MOVEMENTS.map((mv) => (
                      <button key={mv} type="button" onClick={() => onChangeSettings({ stampMovement: settings.stampMovement === mv ? '' : mv })} className={`px-2 py-0.5 text-[11px] rounded border transition-colors ${settings.stampMovement === mv ? 'bg-sky-50 border-sky-400 text-sky-900' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>{mv}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <div className="flex justify-between text-xs text-slate-600 mb-1"><span>スタンプ倍率</span><span className="font-mono-tabular">{settings.stampScale.toFixed(2)}x</span></div>
                  <input type="range" min={0.7} max={1.6} step={0.05} value={settings.stampScale} onChange={(e) => onChangeSettings({ stampScale: Number(e.target.value) })} className="w-full accent-sky-700" />
                </div>
              </div>
            )}

            {isWeatherIconTool && (
              <div className="space-y-3.5">
                <p className="text-xs text-slate-500 leading-relaxed">地図上の配置したい地点をクリックして天気マークを貼り付けます。</p>
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">添えるラベル（気温・地域など任意）</label>
                  <input type="text" value={settings.weatherCaption} onChange={(e) => onChangeSettings({ weatherCaption: e.target.value })} placeholder="例: 22℃ / 大雨注意" className="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded focus:outline-none focus:border-sky-500" />
                </div>
                <div>
                  <div className="flex justify-between text-xs text-slate-600 mb-1"><span>スタンプ倍率</span><span className="font-mono-tabular">{settings.stampScale.toFixed(2)}x</span></div>
                  <input type="range" min={0.7} max={1.8} step={0.05} value={settings.stampScale} onChange={(e) => onChangeSettings({ stampScale: Number(e.target.value) })} className="w-full accent-sky-700" />
                </div>
              </div>
            )}

            {activeTool === 'text' && (
              <div className="space-y-3.5">
                <div>
                  <label className="block text-xs font-medium text-slate-700 mb-1">配置する文字</label>
                  <input type="text" value={settings.textValue} onChange={(e) => onChangeSettings({ textValue: e.target.value })} placeholder="例: 寒冷渦 / 前線停滞" className="w-full px-2.5 py-1.5 text-sm border border-slate-200 rounded focus:outline-none focus:border-sky-500" />
                </div>
                <div>
                  <div className="text-xs font-medium text-slate-700 mb-1.5">文字色</div>
                  <div className="flex items-center gap-2">
                    {PEN_COLORS.map((c) => (
                      <button key={c} type="button" onClick={() => onChangeSettings({ textColor: c })} className={`w-6 h-6 rounded-full border transition-transform ${settings.textColor === c ? 'scale-110 ring-2 ring-sky-500 ring-offset-1 border-white' : 'border-slate-300'}`} style={{ backgroundColor: c }} aria-label={`Text color ${c}`} />
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </aside>
  );
};

// === 7. WeatherCanvas ===
function makeItemId(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
}

function toolToStrokeKind(tool) {
  switch (tool) {
    case 'isobar': case 'warm_front': case 'cold_front': case 'stationary_front':
    case 'occluded_front': case 'trough': case 'arrow': case 'pen':
      return tool;
    default:
      return null;
  }
}

const STAMP_KIND_MAP = {
  stamp_high: 'high', stamp_low: 'low', stamp_typhoon: 'typhoon', stamp_td: 'td',
  stamp_sunny: 'weather_sunny', stamp_cloudy: 'weather_cloudy', stamp_partly: 'weather_partly',
  stamp_rain: 'weather_rain', stamp_snow: 'weather_snow', stamp_thunder: 'weather_thunder', text: 'text',
};
const STAMP_COLOR_MAP = {
  high: '#2563EB', low: '#DC2626', typhoon: '#059669', td: '#0284C7',
  weather_sunny: '#EA580C', weather_cloudy: '#64748B', weather_partly: '#EA580C',
  weather_rain: '#0284C7', weather_snow: '#0284C7', weather_thunder: '#64748B',
};
const STAMP_LABEL_NAMES = {
  high: '高気圧スタンプを追加', low: '低気圧スタンプを追加', typhoon: '台風スタンプを追加',
  td: '熱帯低気圧スタンプを追加', weather_sunny: '晴れスタンプを追加', weather_cloudy: 'くもりスタンプを追加',
  weather_partly: '晴時々曇スタンプを追加', weather_rain: '雨スタンプを追加',
  weather_snow: '雪スタンプを追加', weather_thunder: '雷スタンプを追加', text: 'テキストメモを追加',
};

const WeatherCanvas = ({
  documentState, activeTool, settings, selectedItemId, mapVersion,
  onSelectItem, onAddItem, onEraseItems, onMoveItemFinish, onUnlockOrShowActiveLayer,
}) => {
  const containerRef = useRef(null);
  const canvasRef = useRef(null);
  const [zoom, setZoom] = useState(1);
  const [fitScale, setFitScale] = useState(0.8);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [spacePressed, setSpacePressed] = useState(false);
  const [handPanMode, setHandPanMode] = useState(false);
  const [cursorGeo, setCursorGeo] = useState(null);
  const [hoverChartPt, setHoverChartPt] = useState(null);
  const [previewStroke, setPreviewStroke] = useState(null);
  const [liveMoveDelta, setLiveMoveDelta] = useState(null);

  const gestureRef = useRef({
    mode: 'none', startScreenX: 0, startScreenY: 0, startPanX: 0, startPanY: 0,
    rawPoints: [], moveItemId: null, moveStartChart: { x: 0, y: 0 }, moveOffset: { x: 0, y: 0 },
    erasedIds: new Set(),
  });

  const activeLayer = documentState.layers.find((l) => l.id === documentState.activeLayerId);
  const isActiveLayerBlocked = !activeLayer || !activeLayer.visible || activeLayer.locked;

  useEffect(() => {
    const updateFit = () => {
      if (!containerRef.current) return;
      const rect = containerRef.current.getBoundingClientRect();
      const pad = 40;
      const nextFit = Math.max(0.25, Math.min(1.3, Math.min((rect.width - pad) / CHART_WIDTH, (rect.height - pad) / CHART_HEIGHT)));
      setFitScale(nextFit);
    };
    updateFit();
    const obs = new ResizeObserver(updateFit);
    if (containerRef.current) obs.observe(containerRef.current);
    return () => obs.disconnect();
  }, []);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.code === 'Space' && !(e.target instanceof HTMLInputElement) && !(e.target instanceof HTMLTextAreaElement)) {
        e.preventDefault();
        setSpacePressed(true);
      }
    };
    const onKeyUp = (e) => { if (e.code === 'Space') setSpacePressed(false); };
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    return () => {
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
    };
  }, []);

  const effectiveScale = fitScale * zoom;

  const clientToChartPoint = useCallback((clientX, clientY) => {
    const canvas = canvasRef.current;
    if (!canvas) return null;
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * CHART_WIDTH,
      y: ((clientY - rect.top) / rect.height) * CHART_HEIGHT,
    };
  }, []);

  const renderNow = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const targetW = Math.round(CHART_WIDTH * dpr), targetH = Math.round(CHART_HEIGHT * dpr);
    if (canvas.width !== targetW || canvas.height !== targetH) {
      canvas.width = targetW;
      canvas.height = targetH;
    }
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let stateToDraw = documentState;
    if (liveMoveDelta) {
      stateToDraw = {
        ...documentState,
        layers: documentState.layers.map((layer) => ({
          ...layer,
          items: layer.items.map((item) => {
            if (item.id !== liveMoveDelta.id) return item;
            if (item.itemType === 'stamp') return { ...item, x: item.x + liveMoveDelta.dx, y: item.y + liveMoveDelta.dy };
            return { ...item, points: item.points.map((p) => ({ x: p.x + liveMoveDelta.dx, y: p.y + liveMoveDelta.dy })) };
          }),
        })),
      };
    }

    ctx.clearRect(0, 0, targetW, targetH);
    renderWeatherChart(ctx, stateToDraw, { selectedItemId, previewStroke, scale: dpr });

    if (hoverChartPt && !spacePressed && !handPanMode) {
      ctx.save();
      ctx.scale(dpr, dpr);
      if (activeTool === 'eraser') {
        ctx.beginPath();
        ctx.arc(hoverChartPt.x, hoverChartPt.y, settings.eraserRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(225, 29, 72, 0.85)';
        ctx.fillStyle = 'rgba(225, 29, 72, 0.1)';
        ctx.lineWidth = 1.5;
        ctx.fill();
        ctx.stroke();
      } else if (activeTool !== 'text' && STAMP_KIND_MAP[activeTool]) {
        const kind = STAMP_KIND_MAP[activeTool];
        const isWeatherIcon = kind.startsWith('weather_');
        const ghost = {
          id: 'ghost', itemType: 'stamp', kind, x: hoverChartPt.x, y: hoverChartPt.y,
          labelStyle: settings.stampLabelStyle,
          pressure: isWeatherIcon ? undefined : settings.stampPressure,
          movementText: isWeatherIcon ? undefined : settings.stampMovement,
          text: isWeatherIcon ? settings.weatherCaption || undefined : undefined,
          color: STAMP_COLOR_MAP[kind], scale: settings.stampScale,
        };
        ctx.globalAlpha = 0.55;
        renderStampItem(ctx, ghost, documentState.baseMap, false);
      }
      ctx.restore();
    }
  }, [documentState, selectedItemId, previewStroke, liveMoveDelta, hoverChartPt, activeTool, settings, spacePressed, handPanMode, mapVersion]);

  useEffect(() => { renderNow(); }, [renderNow]);

  const buildStrokeFromPoints = (points, kind) => {
    const colorMap = {
      isobar: '#AUTO', warm_front: '#DC2626', cold_front: '#2563EB',
      stationary_front: '#DC2626', occluded_front: '#7C3AED',
      trough: settings.penColor === '#0F172A' ? '#B45309' : settings.penColor,
      arrow: settings.penColor, pen: settings.penColor,
    };
    const isFront = kind === 'warm_front' || kind === 'cold_front' || kind === 'stationary_front' || kind === 'occluded_front';
    return {
      id: makeItemId('str'), itemType: 'stroke', kind, points, color: colorMap[kind],
      strokeWidth: isFront ? Math.max(2.2, settings.strokeWidth) : settings.strokeWidth,
      lineStyle: kind === 'trough' ? 'dashed' : settings.lineStyle,
      flipSide: settings.flipFrontSide,
      pressureLabel: kind === 'isobar' && settings.showIsobarLabel ? settings.isobarPressure : undefined,
      symbolSpacing: settings.symbolSpacing, symbolSize: settings.symbolSize,
    };
  };

  const findTopItemAt = (pt, tolerance = 14) => {
    for (let li = documentState.layers.length - 1; li >= 0; li--) {
      const layer = documentState.layers[li];
      if (!layer.visible || layer.locked) continue;
      for (let ii = layer.items.length - 1; ii >= 0; ii--) {
        const item = layer.items[ii];
        if (hitTestItem(item, pt, tolerance)) return { item, layerId: layer.id };
      }
    }
    return null;
  };

  const handlePointerDown = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    if (spacePressed || handPanMode || e.button === 1) {
      gestureRef.current = { ...gestureRef.current, mode: 'pan', startScreenX: e.clientX, startScreenY: e.clientY, startPanX: pan.x, startPanY: pan.y };
      return;
    }
    if (e.button !== 0) return;
    const pt = clientToChartPoint(e.clientX, e.clientY);
    if (!pt) return;

    if (activeTool === 'select') {
      const hit = findTopItemAt(pt, 14);
      if (hit) {
        onSelectItem(hit.item.id, hit.layerId);
        gestureRef.current = { ...gestureRef.current, mode: 'move', moveItemId: hit.item.id, moveStartChart: pt, moveOffset: { x: 0, y: 0 } };
      } else {
        onSelectItem(null);
      }
      return;
    }

    if (activeTool === 'eraser') {
      const erased = new Set();
      for (const layer of documentState.layers) {
        if (!layer.visible || layer.locked) continue;
        for (const item of layer.items) {
          if (hitTestItem(item, pt, settings.eraserRadius)) erased.add(item.id);
        }
      }
      gestureRef.current = { ...gestureRef.current, mode: 'erase', erasedIds: erased };
      if (erased.size > 0) onEraseItems(Array.from(erased));
      return;
    }

    if (isActiveLayerBlocked) return;

    if (STAMP_KIND_MAP[activeTool]) {
      const kind = STAMP_KIND_MAP[activeTool];
      const isWeatherIcon = kind.startsWith('weather_');
      const newStamp = {
        id: makeItemId('st'), itemType: 'stamp', kind, x: pt.x, y: pt.y,
        labelStyle: settings.stampLabelStyle,
        pressure: kind === 'text' || isWeatherIcon ? undefined : settings.stampPressure,
        movementText: kind === 'text' || isWeatherIcon ? undefined : settings.stampMovement,
        text: kind === 'text' ? settings.textValue || 'メモ' : isWeatherIcon ? settings.weatherCaption || undefined : undefined,
        color: kind === 'text' ? settings.textColor : STAMP_COLOR_MAP[kind],
        scale: settings.stampScale,
      };
      onAddItem(newStamp, STAMP_LABEL_NAMES[kind]);
      return;
    }

    const strokeKind = toolToStrokeKind(activeTool);
    if (strokeKind) {
      gestureRef.current = { ...gestureRef.current, mode: 'draw', rawPoints: [pt] };
      setPreviewStroke(buildStrokeFromPoints([pt, pt], strokeKind));
    }
  };

  const handlePointerMove = (e) => {
    const pt = clientToChartPoint(e.clientX, e.clientY);
    if (pt) {
      setHoverChartPt(pt);
      setCursorGeo(unprojectXY(pt.x, pt.y));
    }
    const g = gestureRef.current;
    if (g.mode === 'pan') {
      setPan({ x: g.startPanX + (e.clientX - g.startScreenX), y: g.startPanY + (e.clientY - g.startScreenY) });
      return;
    }
    if (!pt) return;
    if (g.mode === 'move' && g.moveItemId) {
      const dx = pt.x - g.moveStartChart.x, dy = pt.y - g.moveStartChart.y;
      g.moveOffset = { x: dx, y: dy };
      setLiveMoveDelta({ id: g.moveItemId, dx, dy });
      return;
    }
    if (g.mode === 'erase') {
      const newlyHit = [];
      for (const layer of documentState.layers) {
        if (!layer.visible || layer.locked) continue;
        for (const item of layer.items) {
          if (!g.erasedIds.has(item.id) && hitTestItem(item, pt, settings.eraserRadius)) {
            g.erasedIds.add(item.id);
            newlyHit.push(item.id);
          }
        }
      }
      if (newlyHit.length > 0) onEraseItems(newlyHit);
      return;
    }
    if (g.mode === 'draw') {
      const last = g.rawPoints[g.rawPoints.length - 1];
      if (!last || Math.hypot(pt.x - last.x, pt.y - last.y) >= 3) {
        g.rawPoints.push(pt);
        const strokeKind = toolToStrokeKind(activeTool);
        if (strokeKind) setPreviewStroke(buildStrokeFromPoints(smoothPolyline(g.rawPoints, 5), strokeKind));
      }
    }
  };

  const handlePointerUp = (e) => {
    if (e.currentTarget.hasPointerCapture(e.pointerId)) e.currentTarget.releasePointerCapture(e.pointerId);
    const g = gestureRef.current;
    if (g.mode === 'move' && g.moveItemId) {
      const { x: dx, y: dy } = g.moveOffset;
      setLiveMoveDelta(null);
      if (Math.hypot(dx, dy) > 2) onMoveItemFinish(g.moveItemId, dx, dy);
    } else if (g.mode === 'draw') {
      const strokeKind = toolToStrokeKind(activeTool);
      if (strokeKind && g.rawPoints.length >= 2) {
        let totalDist = 0;
        for (let i = 1; i < g.rawPoints.length; i++) {
          totalDist += Math.hypot(g.rawPoints[i].x - g.rawPoints[i - 1].x, g.rawPoints[i].y - g.rawPoints[i - 1].y);
        }
        if (totalDist >= 10) {
          const item = buildStrokeFromPoints(smoothPolyline(g.rawPoints, 6), strokeKind);
          const labelMap = {
            isobar: '等圧線を描画', warm_front: '温暖前線を描画', cold_front: '寒冷前線を描画',
            stationary_front: '停滞前線を描画', occluded_front: '閉塞前線を描画',
            trough: '気圧の谷を描画', arrow: '進行矢印を描画', pen: '自由線を描画',
          };
          onAddItem(item, labelMap[strokeKind]);
        }
      }
      setPreviewStroke(null);
    }
    gestureRef.current.mode = 'none';
    gestureRef.current.rawPoints = [];
    gestureRef.current.moveItemId = null;
    gestureRef.current.erasedIds = new Set();
  };

  const handleWheel = (e) => {
    if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 0) {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 0.92;
      setZoom((z) => Math.max(0.5, Math.min(3.0, Number((z * factor).toFixed(2)))));
    }
  };

  const cursorClass = spacePressed || handPanMode
    ? gestureRef.current.mode === 'pan' ? 'cursor-grabbing' : 'cursor-grab'
    : activeTool === 'select' ? 'cursor-default' : 'cursor-crosshair';

  return (
    <div ref={containerRef} onWheel={handleWheel} className="flex-1 bg-slate-100 relative overflow-hidden flex items-center justify-center select-none">
      {isActiveLayerBlocked && activeTool !== 'select' && activeTool !== 'eraser' && (
        <div className="absolute top-3 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 px-3.5 py-2 bg-white border border-amber-300 rounded-lg shadow-sm text-xs text-slate-800">
          {activeLayer && !activeLayer.visible ? (
            <><UiIcon name="eyeOff" className="w-3.5 h-3.5 text-amber-600 shrink-0" /><span>選択中のレイヤー「{activeLayer.name}」は非表示です</span></>
          ) : (
            <><UiIcon name="lock" className="w-3.5 h-3.5 text-amber-600 shrink-0" /><span>選択中のレイヤー「{activeLayer ? activeLayer.name : ''}」はロックされています</span></>
          )}
          <button type="button" onClick={onUnlockOrShowActiveLayer} className="px-2 py-1 rounded bg-amber-100 hover:bg-amber-200 text-amber-900 font-semibold transition-colors whitespace-nowrap">
            描画可能にする
          </button>
        </div>
      )}

      <div
        style={{
          transform: `translate(${pan.x}px, ${pan.y}px)`,
          width: `${Math.round(CHART_WIDTH * effectiveScale)}px`,
          height: `${Math.round(CHART_HEIGHT * effectiveScale)}px`,
        }}
        className="shadow-sm border border-slate-300 bg-white shrink-0"
      >
        <canvas
          ref={canvasRef}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerLeave={() => { setHoverChartPt(null); setCursorGeo(null); }}
          style={{ width: '100%', height: '100%' }}
          className={`block touch-none ${cursorClass}`}
        />
      </div>

      <div className="absolute bottom-3 left-4 pointer-events-none flex items-center gap-2 text-xs font-mono-tabular text-slate-600 bg-white/85 backdrop-blur-sm px-2.5 py-1 rounded border border-slate-200">
        <span>{cursorGeo ? `${cursorGeo.lat.toFixed(2)}°N · ${cursorGeo.lon.toFixed(2)}°E` : '日本周辺域'}</span>
        <span aria-hidden="true" className="text-slate-300">|</span>
        <span>描画先: {activeLayer ? activeLayer.name : '—'}</span>
      </div>

      <div className="absolute bottom-3 right-4 flex items-center gap-1 bg-white border border-slate-200 rounded-lg p-1 shadow-sm">
        <button type="button" onClick={() => setHandPanMode((v) => !v)} title="画面移動モード (または Space+ドラッグ)" className={`p-1.5 rounded transition-colors ${handPanMode ? 'bg-sky-50 text-sky-700' : 'text-slate-600 hover:bg-slate-100'}`}>
          <UiIcon name="hand" />
        </button>
        <div className="w-px h-4 bg-slate-200 mx-0.5" />
        <button type="button" onClick={() => setZoom((z) => Math.max(0.5, Number((z - 0.15).toFixed(2))))} title="縮小" className="p-1.5 rounded text-slate-600 hover:bg-slate-100 transition-colors">
          <UiIcon name="zoomOut" />
        </button>
        <span className="px-1.5 text-xs font-mono-tabular text-slate-700 min-w-[46px] text-center">{Math.round(zoom * 100)}%</span>
        <button type="button" onClick={() => setZoom((z) => Math.min(3.0, Number((z + 0.15).toFixed(2))))} title="拡大" className="p-1.5 rounded text-slate-600 hover:bg-slate-100 transition-colors">
          <UiIcon name="zoomIn" />
        </button>
        <button type="button" onClick={() => { setZoom(1); setPan({ x: 0, y: 0 }); }} title="全体表示に戻す" className="p-1.5 rounded text-slate-600 hover:bg-slate-100 transition-colors">
          <UiIcon name="maximize" />
        </button>
      </div>
    </div>
  );
};

// === 8. RightPanel ===
const THEME_OPTIONS = [
  { id: 'broadcast', label: '放送局風' },
  { id: 'jma_classic', label: '気象庁風' },
  { id: 'monochrome', label: 'モノクロ' },
  { id: 'night', label: 'ナイト' },
];

function formatTime(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
}
function formatShortDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

const RightPanel = ({
  layers, activeLayerId, baseMap, history, historyIndex, snapshots,
  onSelectLayer, onAddLayer, onDeleteLayer, onRenameLayer, onToggleLayerVisibility,
  onToggleLayerLock, onChangeLayerOpacity, onMoveLayer, onChangeBaseMap,
  onJumpToHistory, onSaveNamedSnapshot, onRestoreSnapshot, onDeleteSnapshot,
}) => {
  const [tab, setTab] = useState('layers');
  const [editingLayerId, setEditingLayerId] = useState(null);
  const [editingName, setEditingName] = useState('');
  const [snapshotNameInput, setSnapshotNameInput] = useState('');

  const activeLayer = layers.find((l) => l.id === activeLayerId);
  const displayLayers = [...layers].reverse();

  const handleCommitRename = () => {
    if (editingLayerId && editingName.trim()) onRenameLayer(editingLayerId, editingName.trim());
    setEditingLayerId(null);
  };

  const handleCreateSnapshot = (e) => {
    e.preventDefault();
    onSaveNamedSnapshot(snapshotNameInput.trim());
    setSnapshotNameInput('');
  };

  return (
    <aside className="w-80 shrink-0 bg-white border-l border-slate-200 flex flex-col h-full">
      <div className="p-3 border-b border-slate-200">
        <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-lg">
          <button
            type="button" onClick={() => setTab('layers')}
            className={`flex items-center justify-center gap-1.5 py-1.5 text-xs font-semibold rounded-md transition-colors whitespace-nowrap ${
              tab === 'layers' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
            }`}
          >
            <UiIcon name="layers" className="w-3.5 h-3.5" /><span>レイヤー・地図</span>
          </button>
          <button
            type="button" onClick={() => setTab('history')}
            className={`flex items-center justify-center gap-1.5 py-1.5 text-xs font-semibold rounded-md transition-colors whitespace-nowrap ${
              tab === 'history' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'
            }`}
          >
            <UiIcon name="history" className="w-3.5 h-3.5" /><span>履歴・復元</span>
          </button>
        </div>
      </div>

      {tab === 'layers' ? (
        <div className="flex-1 overflow-y-auto divide-y divide-slate-200">
          <div className="p-4 space-y-3">
            <div className="flex items-center justify-between">

// === 9. ExportModal ===
const ExportModal = ({ isOpen, onClose, documentState }) => {
  const previewCanvasRef = useRef(null);
  const [scaleFactor, setScaleFactor] = useState(2);
  const [format, setFormat] = useState('png');
  const [filename, setFilename] = useState(() => {
    const d = new Date();
    return `tenkizu-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  });
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (!isOpen || !previewCanvasRef.current) return;
    const canvas = previewCanvasRef.current;
    canvas.width = 640;
    canvas.height = 480;
    const ctx = canvas.getContext('2d');
    if (ctx) renderWeatherChart(ctx, documentState, { scale: 640 / CHART_WIDTH });
  }, [isOpen, documentState]);

  if (!isOpen) return null;

  const buildExportCanvas = () => {
    const canvas = document.createElement('canvas');
    canvas.width = CHART_WIDTH * scaleFactor;
    canvas.height = CHART_HEIGHT * scaleFactor;
    const ctx = canvas.getContext('2d');
    if (ctx) renderWeatherChart(ctx, documentState, { scale: scaleFactor });
    return canvas;
  };

  const handleDownload = () => {
    const canvas = buildExportCanvas();
    const mime = format === 'png' ? 'image/png' : 'image/jpeg';
    const link = document.createElement('a');
    const cleanName = (filename.trim() || 'weather-chart').replace(/\.(png|jpg|jpeg)$/i, '');
    link.download = `${cleanName}.${format === 'png' ? 'png' : 'jpg'}`;
    link.href = canvas.toDataURL(mime, 0.94);
    link.click();
    onClose();
  };

  const handleCopyClipboard = async () => {
    try {
      const canvas = buildExportCanvas();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
      if (blob && navigator.clipboard && 'write' in navigator.clipboard) {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }
    } catch {}
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
      <div className="bg-white border border-slate-200 rounded-xl shadow-xl w-full max-w-2xl overflow-hidden">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-200">
          <h2 className="text-base font-bold text-slate-900">天気図を画像として保存</h2>
          <button type="button" onClick={onClose} className="p-1.5 rounded-md text-slate-500 hover:bg-slate-100 hover:text-slate-900 transition-colors" aria-label="閉じる">
            <UiIcon name="x" />
          </button>
        </div>
        <div className="p-5 grid grid-cols-1 md:grid-cols-12 gap-5 items-start">
          <div className="md:col-span-7">
            <div className="border border-slate-200 rounded-lg overflow-hidden bg-slate-100">
              <canvas ref={previewCanvasRef} className="w-full h-auto block" />
            </div>
            <div className="mt-2 text-xs text-slate-500 font-mono-tabular">
              出力サイズ: {CHART_WIDTH * scaleFactor} × {CHART_HEIGHT * scaleFactor} px
            </div>
          </div>
          <div className="md:col-span-5 space-y-4">
            <div>
              <label className="block text-xs font-semibold text-slate-700 mb-1.5">ファイル名</label>
              <input type="text" value={filename} onChange={(e) => setFilename(e.target.value)} className="w-full px-3 py-2 text-sm font-mono-tabular border border-slate-200 rounded-md focus:outline-none focus:border-sky-500" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-700 mb-1.5">画像形式</label>
              <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-md">
                <button type="button" onClick={() => setFormat('png')} className={`py-1.5 text-xs font-semibold rounded transition-colors ${format === 'png' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>PNG (推奨)</button>
                <button type="button" onClick={() => setFormat('jpeg')} className={`py-1.5 text-xs font-semibold rounded transition-colors ${format === 'jpeg' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>JPEG</button>
              </div>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-700 mb-1.5">解像度</label>
              <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-md">
                <button type="button" onClick={() => setScaleFactor(1)} className={`py-1.5 text-xs font-medium rounded transition-colors ${scaleFactor === 1 ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>標準 (1200×900)</button>
                <button type="button" onClick={() => setScaleFactor(2)} className={`py-1.5 text-xs font-medium rounded transition-colors ${scaleFactor === 2 ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}>高精細 (2400×1800)</button>
              </div>
            </div>
            <div className="pt-2 space-y-2">
              <button type="button" onClick={handleDownload} className="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-sky-700 hover:bg-sky-800 text-white text-sm font-semibold rounded-lg transition-colors">
                <UiIcon name="download" /><span>画像をダウンロード</span>
              </button>
              <button type="button" onClick={handleCopyClipboard} className="w-full flex items-center justify-center gap-2 py-2 px-4 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-lg transition-colors">
                {copied ? <><UiIcon name="check" className="w-4 h-4 text-emerald-600" /><span className="text-emerald-700">コピーしました</span></> : <><UiIcon name="copy" /><span>クリップボードにコピー</span></>}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// === 10. Main App ===
const STORAGE_DOC_KEY = 'tenkizu_studio_active_doc_v1';
const STORAGE_SNAPSHOTS_KEY = 'tenkizu_studio_snapshots_v1';
const STORAGE_HISTORY_KEY = 'tenkizu_studio_history_v1';
const MAX_HISTORY_LENGTH = 50;

function cloneDoc(doc) { return JSON.parse(JSON.stringify(doc)); }
function makeHistoryEntry(label, state) {
  return { id: `hist_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`, label, timestamp: Date.now(), state: cloneDoc(state) };
}
function migratePressureColors(doc) {
  return {
    ...doc,
    layers: doc.layers.map((layer) => ({
      ...layer,
      items: layer.items.map((item) => {
        if (item.itemType !== 'stamp') return item;
        if (item.kind === 'high' && item.color === '#DC2626') return { ...item, color: '#2563EB' };
        if (item.kind === 'low' && item.color === '#2563EB') return { ...item, color: '#DC2626' };
        return item;
      }),
    })),
  };
}
function loadInitialDocument() {
  try {
    const raw = localStorage.getItem(STORAGE_DOC_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.layers) && parsed.layers.length > 0) return migratePressureColors(parsed);
    }
  } catch {}
  return CHART_PRESETS[1].create();
}
function loadInitialHistory(fallbackDoc) {
  try {
    const raw = localStorage.getItem(STORAGE_HISTORY_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.entries) && parsed.entries.length > 0) {
        return {
          entries: parsed.entries.map((e) => ({ ...e, state: migratePressureColors(e.state) })),
          index: Math.max(0, Math.min(parsed.entries.length - 1, parsed.index ?? 0)),
        };
      }
    }
  } catch {}
  return { entries: [makeHistoryEntry('初期状態', fallbackDoc)], index: 0 };
}
function loadInitialSnapshots() {
  try {
    const raw = localStorage.getItem(STORAGE_SNAPSHOTS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch {}
  return [];
}

function App() {
  const initialDoc = useMemo(() => loadInitialDocument(), []);
  const initialHist = useMemo(() => loadInitialHistory(initialDoc), [initialDoc]);

  const [documentState, setDocumentState] = useState(() => initialHist.entries[initialHist.index]?.state ?? initialDoc);
  const [history, setHistory] = useState(initialHist.entries);
  const [historyIndex, setHistoryIndex] = useState(initialHist.index);
  const [snapshots, setSnapshots] = useState(loadInitialSnapshots);
  const [activeTool, setActiveTool] = useState('isobar');
  const [selectedItemId, setSelectedItemId] = useState(null);
  const [exportOpen, setExportOpen] = useState(false);
  const [toastMessage, setToastMessage] = useState(null);
  const [mapVersion, setMapVersion] = useState(0);

  const [settings, setSettings] = useState({
    strokeWidth: 2.0, lineStyle: 'solid', isobarPressure: '1012', showIsobarLabel: true,
    flipFrontSide: false, symbolSpacing: 32, symbolSize: 8, penColor: '#0F172A',
    stampLabelStyle: 'ja', stampPressure: '1008', stampMovement: '', stampScale: 1.0,
    weatherCaption: '', textValue: '寒冷渦', textColor: '#0F172A', eraserRadius: 16,
  });

  useEffect(() => {
    let cancelled = false;
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
      .then((res) => (res.ok ? res.json() : Promise.reject(new Error('Map fetch failed'))))
      .then((topology) => {
        if (cancelled) return;
        const geom = buildGeometryFromTopology(topology);
        if (geom && geom.landRings.length > 0) {
          cachedGeometry = geom;
          setMapVersion((v) => v + 1);
        }
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  const showToast = useCallback((msg) => setToastMessage(msg), []);
  useEffect(() => {
    if (!toastMessage) return;
    const t = setTimeout(() => setToastMessage(null), 2600);
    return () => clearTimeout(t);
  }, [toastMessage]);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_DOC_KEY, JSON.stringify(documentState)); } catch {}
  }, [documentState]);
  useEffect(() => {
    try { localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify({ entries: history.slice(-30), index: Math.min(historyIndex, 29) })); } catch {}
  }, [history, historyIndex]);
  useEffect(() => {
    try { localStorage.setItem(STORAGE_SNAPSHOTS_KEY, JSON.stringify(snapshots)); } catch {}
  }, [snapshots]);

  const commitDocumentChange = useCallback((nextState, historyLabel) => {
    const cloned = cloneDoc(nextState);
    setDocumentState(cloned);
    const updated = [...history.slice(0, historyIndex + 1), makeHistoryEntry(historyLabel, cloned)];
    if (updated.length > MAX_HISTORY_LENGTH) {
      setHistory(updated.slice(updated.length - MAX_HISTORY_LENGTH));
      setHistoryIndex(MAX_HISTORY_LENGTH - 1);
    } else {
      setHistory(updated);
      setHistoryIndex(updated.length - 1);
    }
  }, [history, historyIndex]);

  useEffect(() => {
    if (historyIndex >= history.length) setHistoryIndex(Math.max(0, history.length - 1));
  }, [history.length, historyIndex]);

  const handleUndo = useCallback(() => {
    if (historyIndex <= 0) return;
    const entry = history[historyIndex - 1];
    if (entry) {
      setHistoryIndex(historyIndex - 1);
      setDocumentState(cloneDoc(entry.state));
      setSelectedItemId(null);
    }
  }, [history, historyIndex]);

  const handleRedo = useCallback(() => {
    if (historyIndex >= history.length - 1) return;
    const entry = history[historyIndex + 1];
    if (entry) {
      setHistoryIndex(historyIndex + 1);
      setDocumentState(cloneDoc(entry.state));
      setSelectedItemId(null);
    }
  }, [history, historyIndex]);

  const handleJumpToHistory = useCallback((idx) => {
    const entry = history[idx];
    if (!entry) return;
    setHistoryIndex(idx);
    setDocumentState(cloneDoc(entry.state));
    setSelectedItemId(null);
    showToast(`「${entry.label}」の時点に復元しました`);
  }, [history, showToast]);

  const selectedItem = useMemo(() => {
    if (!selectedItemId) return null;
    for (const layer of documentState.layers) {
      const found = layer.items.find((i) => i.id === selectedItemId);
      if (found) return found;
    }
    return null;
  }, [documentState.layers, selectedItemId]);

  const handleDeleteSelectedItem = useCallback(() => {
    if (!selectedItemId) return;
    const nextState = {
      ...documentState,
      layers: documentState.layers.map((l) => ({ ...l, items: l.items.filter((i) => i.id !== selectedItemId) })),
    };
    setSelectedItemId(null);
    commitDocumentChange(nextState, '選択要素を削除');
  }, [selectedItemId, documentState, commitDocumentChange]);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) handleRedo(); else handleUndo();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        handleRedo();
        return;
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedItemId) {
        e.preventDefault();
        handleDeleteSelectedItem();
        return;
      }
      if (!e.metaKey && !e.ctrlKey && !e.altKey) {
        const k = e.key.toLowerCase();
        if (k === 'v') setActiveTool('select');
        if (k === 'e') setActiveTool('eraser');
        if (k === 'i') setActiveTool('isobar');
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [handleUndo, handleRedo, selectedItemId, handleDeleteSelectedItem]);

  const handleAddItem = useCallback((item, historyLabel) => {
    const nextState = {
      ...documentState,
      layers: documentState.layers.map((layer) =>
        layer.id === documentState.activeLayerId ? { ...layer, items: [...layer.items, item] } : layer
      ),
    };
    commitDocumentChange(nextState, historyLabel);
  }, [documentState, commitDocumentChange]);

  const handleEraseItems = useCallback((itemIds) => {
    if (itemIds.length === 0) return;
    const idSet = new Set(itemIds);
    const nextState = {
      ...documentState,
      layers: documentState.layers.map((layer) =>
        layer.visible && !layer.locked ? { ...layer, items: layer.items.filter((i) => !idSet.has(i.id)) } : layer
      ),
    };
    if (selectedItemId && idSet.has(selectedItemId)) setSelectedItemId(null);
    commitDocumentChange(nextState, '消しゴムで削除');
  }, [documentState, selectedItemId, commitDocumentChange]);

  const handleMoveItemFinish = useCallback((itemId, dx, dy) => {
    const nextState = {
      ...documentState,
      layers: documentState.layers.map((layer) => ({
        ...layer,
        items: layer.items.map((item) => {
          if (item.id !== itemId) return item;
          if (item.itemType === 'stamp') return { ...item, x: item.x + dx, y: item.y + dy };
          return { ...item, points: item.points.map((p) => ({ x: p.x + dx, y: p.y + dy })) };
        }),
      })),
    };
    commitDocumentChange(nextState, '要素を移動');
  }, [documentState, commitDocumentChange]);

  const handleUpdateSelectedItem = useCallback((updater) => {
    if (!selectedItemId) return;
    const nextState = {
      ...documentState,
      layers: documentState.layers.map((layer) => ({
        ...layer,
        items: layer.items.map((item) => (item.id === selectedItemId ? updater(item) : item)),
      })),
    };
    commitDocumentChange(nextState, '要素のプロパティを変更');
  }, [selectedItemId, documentState, commitDocumentChange]);

  const handleSelectItem = useCallback((id, layerId) => {
    setSelectedItemId(id);
    if (id && layerId) setDocumentState((prev) => ({ ...prev, activeLayerId: layerId }));
  }, []);

  const handleAddLayer = () => {
    const newLayer = {
      id: `layer_${Date.now().toString(36)}`,
      name: `レイヤー ${documentState.layers.length + 1}`,
      visible: true, locked: false, opacity: 1, items: [],
    };
    commitDocumentChange({ ...documentState, layers: [...documentState.layers, newLayer], activeLayerId: newLayer.id }, `レイヤー「${newLayer.name}」を追加`);
  };

  const handleDeleteLayer = (id) => {
    if (documentState.layers.length <= 1) return;
    const target = documentState.layers.find((l) => l.id === id);
    const remaining = documentState.layers.filter((l) => l.id !== id);
    const nextActive = documentState.activeLayerId === id ? remaining[remaining.length - 1].id : documentState.activeLayerId;
    setSelectedItemId(null);
    commitDocumentChange({ ...documentState, layers: remaining, activeLayerId: nextActive }, `レイヤー「${target?.name ?? ''}」を削除`);
  };

  const handleRenameLayer = (id, name) => {
    commitDocumentChange(
      { ...documentState, layers: documentState.layers.map((l) => (l.id === id ? { ...l, name } : l)) },
      `レイヤー名を「${name}」に変更`
    );
  };

  const handleToggleLayerVisibility = (id) => {
    const target = documentState.layers.find((l) => l.id === id);
    commitDocumentChange(
      { ...documentState, layers: documentState.layers.map((l) => (l.id === id ? { ...l, visible: !l.visible } : l)) },
      `レイヤー「${target?.name ?? ''}」を${target?.visible ? '非表示' : '表示'}`
    );
  };

  const handleToggleLayerLock = (id) => {
    setDocumentState((prev) => ({ ...prev, layers: prev.layers.map((l) => (l.id === id ? { ...l, locked: !l.locked } : l)) }));
  };

  const handleChangeLayerOpacity = (id, opacity) => {
    setDocumentState((prev) => ({ ...prev, layers: prev.layers.map((l) => (l.id === id ? { ...l, opacity } : l)) }));
  };

  const handleMoveLayer = (id, direction) => {
    const idx = documentState.layers.findIndex((l) => l.id === id);
    if (idx === -1) return;
    const swapIdx = direction === 'up' ? idx + 1 : idx - 1;
    if (swapIdx < 0 || swapIdx >= documentState.layers.length) return;
    const reordered = [...documentState.layers];
    const [removed] = reordered.splice(idx, 1);
    reordered.splice(swapIdx, 0, removed);
    commitDocumentChange({ ...documentState, layers: reordered }, `レイヤー「${removed.name}」の順序を変更`);
  };

  const handleUnlockOrShowActiveLayer = () => {
    setDocumentState((prev) => ({
      ...prev,
      layers: prev.layers.map((l) => (l.id === prev.activeLayerId ? { ...l, visible: true, locked: false } : l)),
    }));
  };

  const handleChangeBaseMap = (patch) => {
    setDocumentState((prev) => ({ ...prev, baseMap: { ...prev.baseMap, ...patch } }));
  };

  const handleLoadPreset = (preset) => {
    setSelectedItemId(null);
    commitDocumentChange(preset.create(), `テンプレート「${preset.name}」を読み込み`);
    showToast(`テンプレート「${preset.name}」を読み込みました`);
  };

  const handleClearCanvas = () => {
    const blank = createBlankDocument();
    blank.baseMap = { ...documentState.baseMap };
    setSelectedItemId(null);
    commitDocumentChange(blank, 'キャンバスを白紙にリセット');
    showToast('すべての描画をクリアしました');
  };

  const handleSaveSnapshot = (customName) => {
    const thumb = generateSnapshotThumbnail(documentState);
    const now = new Date();
    const defaultName = `${documentState.baseMap.chartTitle || '天気図'} (${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')})`;
    const snap = {
      id: `snap_${Date.now().toString(36)}`,
      name: customName && customName.trim() ? customName.trim() : defaultName,
      createdAt: Date.now(), thumbnailDataUrl: thumb, state: cloneDoc(documentState),
    };
    setSnapshots((prev) => [snap, ...prev].slice(0, 24));
    showToast(`履歴「${snap.name}」を保存しました`);
  };

  const handleRestoreSnapshot = (snap) => {
    setSelectedItemId(null);
    commitDocumentChange(cloneDoc(snap.state), `スナップショット「${snap.name}」を復元`);
    showToast(`「${snap.name}」を復元しました`);
  };

  const handleDeleteSnapshot = (id) => {
    setSnapshots((prev) => prev.filter((s) => s.id !== id));
  };

  return (
    <div className="h-screen w-screen flex flex-col bg-slate-50 text-slate-900 overflow-hidden">
      <TopBar
        canUndo={historyIndex > 0} canRedo={historyIndex < history.length - 1}
        onUndo={handleUndo} onRedo={handleRedo}
        onSaveSnapshot={() => handleSaveSnapshot()}
        onLoadPreset={handleLoadPreset} onClearCanvas={handleClearCanvas}
        onOpenExport={() => setExportOpen(true)}
      />
      <main className="flex-1 flex min-h-0 overflow-hidden">
        <ToolSidebar
          activeTool={activeTool}
          onSelectTool={(t) => { setActiveTool(t); if (t !== 'select') setSelectedItemId(null); }}
          settings={settings} onChangeSettings={(patch) => setSettings((prev) => ({ ...prev, ...patch }))}
          selectedItem={selectedItem} onUpdateSelectedItem={handleUpdateSelectedItem}
          onDeleteSelectedItem={handleDeleteSelectedItem}
        />
        <WeatherCanvas
          documentState={documentState} activeTool={activeTool} settings={settings}
          selectedItemId={selectedItemId} mapVersion={mapVersion}
          onSelectItem={handleSelectItem} onAddItem={handleAddItem}
          onEraseItems={handleEraseItems} onMoveItemFinish={handleMoveItemFinish}
          onUnlockOrShowActiveLayer={handleUnlockOrShowActiveLayer}
        />
        <RightPanel
          layers={documentState.layers} activeLayerId={documentState.activeLayerId}
          baseMap={documentState.baseMap} history={history} historyIndex={historyIndex} snapshots={snapshots}
          onSelectLayer={(id) => setDocumentState((prev) => ({ ...prev, activeLayerId: id }))}
          onAddLayer={handleAddLayer} onDeleteLayer={handleDeleteLayer}
          onRenameLayer={handleRenameLayer} onToggleLayerVisibility={handleToggleLayerVisibility}
          onToggleLayerLock={handleToggleLayerLock} onChangeLayerOpacity={handleChangeLayerOpacity}
          onMoveLayer={handleMoveLayer} onChangeBaseMap={handleChangeBaseMap}
          onJumpToHistory={handleJumpToHistory} onSaveNamedSnapshot={(name) => handleSaveSnapshot(name)}
          onRestoreSnapshot={handleRestoreSnapshot} onDeleteSnapshot={handleDeleteSnapshot}
        />
      </main>
      <ExportModal isOpen={exportOpen} onClose={() => setExportOpen(false)} documentState={documentState} />
      {toastMessage && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-slate-900 text-white text-xs font-medium rounded-lg shadow-lg pointer-events-none">
          {toastMessage}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
