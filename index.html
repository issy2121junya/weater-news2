const { useState, useEffect, useRef, useMemo, useCallback } = React;

// === 1. Map Projection & East Asia Geometry ===
const CHART_WIDTH = 1200;
const CHART_HEIGHT = 900;
const LON_CENTER = 137.5;
const LAT_REF = 36.0;
const PROJECTION_R = 2320;
const ORIGIN_X = CHART_WIDTH * 0.51;
const R_REF = PROJECTION_R * Math.tan(Math.PI / 4 - (LAT_REF * Math.PI) / 360);
const ORIGIN_Y = CHART_HEIGHT * 0.52 - R_REF;
const DEG_TO_RAD = Math.PI / 180;
const RAD_TO_DEG = 180 / Math.PI;

function projectLonLat(lon, lat) {
  const clampedLat = Math.max(-60, Math.min(89.5, lat));
  const phi = clampedLat * DEG_TO_RAD;
  const lambda = (lon - LON_CENTER) * DEG_TO_RAD;
  const r = PROJECTION_R * Math.tan(Math.PI / 4 - phi / 2);
  return { x: ORIGIN_X + r * Math.sin(lambda), y: ORIGIN_Y + r * Math.cos(lambda) };
}

function unprojectXY(x, y) {
  const dx = x - ORIGIN_X;
  const dy = y - ORIGIN_Y;
  const r = Math.sqrt(dx * dx + dy * dy);
  const lambda = Math.atan2(dx, dy);
  const phi = Math.PI / 2 - 2 * Math.atan(r / PROJECTION_R);
  let lon = LON_CENTER + lambda * RAD_TO_DEG;
  if (lon > 180) lon -= 360;
  if (lon < -180) lon += 360;
  return { lon, lat: phi * RAD_TO_DEG };
}

const REFERENCE_CITIES = [
  { name: '札幌', lon: 141.35, lat: 43.06, isMajor: true },
  { name: '仙台', lon: 140.87, lat: 38.27 },
  { name: '東京', lon: 139.77, lat: 35.68, isMajor: true },
  { name: '名古屋', lon: 136.91, lat: 35.18 },
  { name: '大阪', lon: 135.5, lat: 34.69, isMajor: true },
  { name: '広島', lon: 132.46, lat: 34.39 },
  { name: '福岡', lon: 130.4, lat: 33.59, isMajor: true },
  { name: '鹿児島', lon: 130.56, lat: 31.6 },
  { name: '那覇', lon: 127.68, lat: 26.21, isMajor: true },
  { name: 'ソウル', lon: 126.98, lat: 37.57 },
  { name: '台北', lon: 121.56, lat: 25.03 },
  { name: '上海', lon: 121.47, lat: 31.23 },
  { name: 'ウラジオストク', lon: 131.89, lat: 43.12 },
].map((c) => ({ ...c, ...projectLonLat(c.lon, c.lat) }));

function ringIntersectsChart(ring) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < ring.length; i++) {
    const [lon, lat] = ring[i];
    if (lat < -5 || lat > 80) continue;
    const pt = projectLonLat(lon, lat);
    if (pt.x < minX) minX = pt.x;
    if (pt.x > maxX) maxX = pt.x;
    if (pt.y < minY) minY = pt.y;
    if (pt.y > maxY) maxY = pt.y;
  }
  const margin = 120;
  return maxX >= -margin && minX <= CHART_WIDTH + margin && maxY >= -margin && minY <= CHART_HEIGHT + margin;
}

function projectRing(ring) {
  const arr = new Float32Array(ring.length * 2);
  for (let i = 0; i < ring.length; i++) {
    const pt = projectLonLat(ring[i][0], ring[i][1]);
    arr[i * 2] = pt.x;
    arr[i * 2 + 1] = pt.y;
  }
  return { points: arr };
}

const FALLBACK_LAND_COORDS = [

  [[140.9,41.5],[141.5,40.4],[142.0,39.4],[141.4,38.3],[140.9,37.1],[140.9,35.7],[139.8,35.1],[138.8,34.7],[136.9,34.6],[135.8,33.5],[135.1,34.2],[133.9,34.4],[131.0,34.0],[131.8,34.8],[133.2,35.5],[135.2,35.7],[136.7,36.8],[137.4,37.5],[139.0,38.0],[140.0,39.7],[140.3,41.1],[140.9,41.5]],

  [[105.0,55.0],[135.0,55.0],[141.0,53.0],[140.0,49.0],[136.0,45.0],[132.0,43.0],[129.4,41.0],[129.1,35.1],[126.4,34.6],[126.1,37.6],[124.2,39.9],[121.1,38.8],[118.5,39.0],[122.4,37.3],[119.5,34.5],[121.9,31.2],[120.8,28.0],[117.5,23.8],[113.5,22.1],[108.0,21.5],[105.0,22.0],[105.0,55.0]],
  [[142.0,46.0],[143.5,46.8],[143.0,50.5],[142.8,54.2],[141.8,53.5],[142.0,46.0]],
  [[156.5,51.0],[158.5,53.0],[162.0,56.0],[155.0,56.0],[156.5,51.0]],
];

let cachedGeometry = {
  landRings: FALLBACK_LAND_COORDS.map(projectRing),
  borderLines: [],
};

function buildGeometryFromTopology(topology) {
  if (!window.topojson) return null;
  const landGeo = window.topojson.feature(topology, topology.objects.land);
  const landRings = [];
  const extractRings = (coords) => {
    for (const ring of coords) {
      if (ring.length >= 3 && ringIntersectsChart(ring)) landRings.push(projectRing(ring));
    }
  };
  if (landGeo.type === 'FeatureCollection') {
    for (const f of landGeo.features) {
      if (!f.geometry) continue;
      if (f.geometry.type === 'Polygon') extractRings(f.geometry.coordinates);
      else if (f.geometry.type === 'MultiPolygon') {
        for (const poly of f.geometry.coordinates) extractRings(poly);
      }
    }
  }
  const borderMesh = window.topojson.mesh(topology, topology.objects.countries, (a, b) => a !== b);
  const borderLines = [];
  if (borderMesh.type === 'MultiLineString') {
    for (const line of borderMesh.coordinates) {
      if (line.length >= 2 && ringIntersectsChart(line)) borderLines.push(projectRing(line));
    }
  }
  return { landRings, borderLines };
}

// === 2. Weather Chart Renderer ===
const MAP_THEMES = {
  broadcast: {
    ocean: '#E4F1FA', land: '#DCE9D5', coastline: '#5E7C68', border: '#7C9885',
    grid: 'rgba(51, 102, 153, 0.18)', gridText: '#476E8E', cityDot: '#334155', cityText: '#1E293B',
    isobarDefault: '#1E293B', labelHalo: 'rgba(255, 255, 255, 0.92)', frameBg: '#F8FAFC',

    isobarDefault: '#0F172A', labelHalo: 'rgba(248, 250, 252, 0.94)', frameBg: '#FFFFFF',
    frameBorder: '#CBD5E1', headerBg: 'rgba(255, 255, 255, 0.94)', headerText: '#0F172A',
  },
  monochrome: {
    ocean: '#FFFFFF', land: '#F1F5F9', coastline: '#334155', border: '#94A3B8',
    grid: 'rgba(148, 163, 184, 0.26)', gridText: '#64748B', cityDot: '#0F172A', cityText: '#1E293B',
    isobarDefault: '#0F172A', labelHalo: 'rgba(255, 255, 255, 0.96)', frameBg: '#FFFFFF',
    frameBorder: '#94A3B8', headerBg: 'rgba(255, 255, 255, 0.96)', headerText: '#0F172A',
  },
  night: {
    ocean: '#0C1628', land: '#1A293E', coastline: '#4B6584', border: '#334863',
    grid: 'rgba(148, 163, 184, 0.16)', gridText: '#7C93B0', cityDot: '#94A3B8', cityText: '#CBD5E1',
    isobarDefault: '#E2E8F0', labelHalo: 'rgba(12, 22, 40, 0.9)', frameBg: '#09111F',
    frameBorder: '#273852', headerBg: 'rgba(15, 23, 42, 0.9)', headerText: '#F1F5F9',
  },
};

function smoothPolyline(rawPoints, subdivisions = 6) {
  if (rawPoints.length <= 2) return rawPoints;
  const thinned = [rawPoints[0]];
  for (let i = 1; i < rawPoints.length - 1; i++) {
    const last = thinned[thinned.length - 1];
    const dx = rawPoints[i].x - last.x;
    const dy = rawPoints[i].y - last.y;
    if (dx * dx + dy * dy >= 64) thinned.push(rawPoints[i]);
  }
  thinned.push(rawPoints[rawPoints.length - 1]);
  if (thinned.length <= 2) return thinned;

  const result = [];
  for (let i = 0; i < thinned.length - 1; i++) {
    const p0 = thinned[Math.max(0, i - 1)];
    const p1 = thinned[i];
    const p2 = thinned[i + 1];
    const p3 = thinned[Math.min(thinned.length - 1, i + 2)];
    for (let s = 0; s < subdivisions; s++) {
      const t = s / subdivisions, t2 = t * t, t3 = t2 * t;
      result.push({
        x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
      });
    }
  }
  result.push(thinned[thinned.length - 1]);
  return result;
}

function sampleAlongPolyline(points, step) {
  if (points.length < 2) return { samples: [], totalLength: 0 };
  const cumLen = [0];
  let totalLength = 0;
  for (let i = 1; i < points.length; i++) {
    totalLength += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    cumLen.push(totalLength);
  }
  if (totalLength < 8) return { samples: [], totalLength };

  const samples = [];
  let segIdx = 0;
  const startOffset = Math.min(step * 0.5, totalLength * 0.15);
  for (let d = startOffset; d <= totalLength - startOffset * 0.5; d += step) {
    while (segIdx < cumLen.length - 2 && cumLen[segIdx + 1] < d) segIdx++;
    const segLen = Math.max(0.0001, cumLen[segIdx + 1] - cumLen[segIdx]);
    const t = Math.max(0, Math.min(1, (d - cumLen[segIdx]) / segLen));
    const pA = points[segIdx], pB = points[segIdx + 1];
    const dx = pB.x - pA.x, dy = pB.y - pA.y;
    const len = Math.max(0.0001, Math.hypot(dx, dy));
    samples.push({ x: pA.x + dx * t, y: pA.y + dy * t, tx: dx / len, ty: dy / len, dist: d });
  }
  return { samples, totalLength };
}

function getPointAtFraction(points, fraction) {
  if (points.length < 2) return null;
  const cumLen = [0];
  let totalLength = 0;
  for (let i = 1; i < points.length; i++) {
    totalLength += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
    cumLen.push(totalLength);
  }
  if (totalLength < 2) return null;
  const target = totalLength * fraction;
  let segIdx = 0;
  while (segIdx < cumLen.length - 2 && cumLen[segIdx + 1] < target) segIdx++;
  const segLen = Math.max(0.0001, cumLen[segIdx + 1] - cumLen[segIdx]);
  const t = (target - cumLen[segIdx]) / segLen;
  const pA = points[segIdx], pB = points[segIdx + 1];
  const dx = pB.x - pA.x, dy = pB.y - pA.y;
  const len = Math.max(0.0001, Math.hypot(dx, dy));
  return { x: pA.x + dx * t, y: pA.y + dy * t, tx: dx / len, ty: dy / len, dist: target };
}

function drawSmoothCurvePath(ctx, points) {
  if (points.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length - 1; i++) {
    ctx.quadraticCurveTo(points[i].x, points[i].y, (points[i].x + points[i + 1].x) * 0.5, (points[i].y + points[i + 1].y) * 0.5);
  }
  ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
}

function drawSemicircle(ctx, x, y, tx, ty, radius, sideSign, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(ty, tx));
  ctx.beginPath();
  if (sideSign > 0) ctx.arc(0, 0, radius, 0, Math.PI, false);
  else ctx.arc(0, 0, radius, Math.PI, 0, false);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawTriangle(ctx, x, y, tx, ty, baseHalf, height, sideSign, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(ty, tx));
  ctx.beginPath();
  ctx.moveTo(-baseHalf, 0);
  ctx.lineTo(baseHalf, 0);
  ctx.lineTo(0, sideSign * height);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function renderBaseMap(ctx, baseMap) {
  const palette = MAP_THEMES[baseMap.theme];
  const geom = cachedGeometry;

  ctx.fillStyle = palette.ocean;
  ctx.fillRect(0, 0, CHART_WIDTH, CHART_HEIGHT);

  ctx.save();
  ctx.beginPath();
  for (const ring of geom.landRings) {
    const pts = ring.points;
    if (pts.length < 4) continue;
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath();
  }
  ctx.fillStyle = palette.land;
  ctx.fill();
  ctx.lineWidth = 1.1;
  ctx.strokeStyle = palette.coastline;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();

  if (baseMap.showBorders) {
    ctx.save();
    ctx.beginPath();
    for (const line of geom.borderLines) {
      const pts = line.points;
      if (pts.length < 4) continue;
      ctx.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    }
    ctx.strokeStyle = palette.border;
    ctx.lineWidth = 0.8;
    ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.restore();
  }

  if (baseMap.showGrid) {
    ctx.save();
    ctx.strokeStyle = palette.grid;
    ctx.lineWidth = 0.85;
    ctx.font = '500 10px "JetBrains Mono", monospace';
    ctx.fillStyle = palette.gridText;

    for (let lat = 15; lat <= 55; lat += 5) {
      ctx.beginPath();
      let started = false;
      for (let lon = 105; lon <= 170; lon += 1.5) {
        const pt = projectLonLat(lon, lat);
        if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      for (let lon = 112; lon <= 128; lon += 0.5) {
        const pt = projectLonLat(lon, lat);
        if (pt.x >= 18 && pt.x <= 90 && pt.y >= 24 && pt.y <= CHART_HEIGHT - 20) {
          ctx.fillText(`${lat}°N`, 10, pt.y - 3);
          break;
        }
      }
    }

    for (let lon = 110; lon <= 165; lon += 5) {
      ctx.beginPath();
      let started = false;
      for (let lat = 15; lat <= 55; lat += 1.5) {
        const pt = projectLonLat(lon, lat);
        if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      for (let lat = 18; lat <= 30; lat += 0.5) {
        const pt = projectLonLat(lon, lat);
        if (pt.y <= CHART_HEIGHT - 12 && pt.y >= CHART_HEIGHT - 60 && pt.x >= 40 && pt.x <= CHART_WIDTH - 40) {
          ctx.fillText(`${lon}°E`, pt.x + 3, CHART_HEIGHT - 10);
          break;
        }
      }
    }
    ctx.restore();
  }

  if (baseMap.showCities) {
    ctx.save();
    ctx.font = '500 11px "IBM Plex Sans JP", sans-serif';
    for (const city of REFERENCE_CITIES) {
      if (city.x < 16 || city.x > CHART_WIDTH - 16 || city.y < 16 || city.y > CHART_HEIGHT - 16) continue;
      ctx.beginPath();
      ctx.arc(city.x, city.y, city.isMajor ? 2.8 : 2, 0, Math.PI * 2);
      ctx.fillStyle = palette.cityDot;
      ctx.fill();
      ctx.strokeStyle = palette.labelHalo;
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.strokeText(city.name, city.x + 6, city.y + 4);
      ctx.fillStyle = palette.cityText;
      ctx.fillText(city.name, city.x + 6, city.y + 4);
    }
    ctx.restore();
  }

  ctx.save();
  ctx.strokeStyle = palette.frameBorder;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0.75, 0.75, CHART_WIDTH - 1.5, CHART_HEIGHT - 1.5);
  ctx.restore();
}

function renderChartHeader(ctx, baseMap) {
  if (!baseMap.showChartHeader) return;
  const palette = MAP_THEMES[baseMap.theme];
  ctx.save();
  const boxX = 18, boxY = 18;
  const titleText = baseMap.chartTitle || '地上天気図';
  const dateText = baseMap.chartDateText || '';
  ctx.font = '700 16px "IBM Plex Sans JP", sans-serif';
  const titleW = ctx.measureText(titleText).width;
  ctx.font = '500 12px "JetBrains Mono", "IBM Plex Sans JP", monospace';
  const dateW = dateText ? ctx.measureText(dateText).width : 0;
  const boxW = Math.max(titleW, dateW) + 28;
  const boxH = dateText ? 54 : 34;

  ctx.fillStyle = palette.headerBg;
  ctx.strokeStyle = palette.frameBorder;
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(boxX, boxY, boxW, boxH, 4);
  else ctx.rect(boxX, boxY, boxW, boxH);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = palette.headerText;
  ctx.font = '700 15px "IBM Plex Sans JP", sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText(titleText, boxX + 14, boxY + 9);
  if (dateText) {
    ctx.font = '500 11.5px "JetBrains Mono", "IBM Plex Sans JP", monospace';
    ctx.globalAlpha = 0.78;
    ctx.fillText(dateText, boxX + 14, boxY + 31);
  }
  ctx.restore();
}

function renderStrokeItem(ctx, item, baseMap, isSelected = false) {
  const pts = item.points;
  if (pts.length < 2) return;
  const palette = MAP_THEMES[baseMap.theme];
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (isSelected) {
    ctx.save();
    drawSmoothCurvePath(ctx, pts);
    ctx.strokeStyle = 'rgba(14, 165, 233, 0.35)';
    ctx.lineWidth = item.strokeWidth + 8;
    ctx.stroke();
    ctx.restore();
  }

  const spacing = item.symbolSpacing ?? 32;
  const symSize = item.symbolSize ?? 8;
  const sideSign = item.flipSide ? 1 : -1;

  if (item.kind === 'isobar') {
    drawSmoothCurvePath(ctx, pts);
    const strokeColor = item.color === '#AUTO' ? palette.isobarDefault : item.color;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = item.strokeWidth;
    if (item.lineStyle === 'dashed') ctx.setLineDash([8, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
    if (item.pressureLabel && item.pressureLabel.trim()) {
      const mid = getPointAtFraction(pts, 0.5);
      if (mid) {
        const label = item.pressureLabel.trim();
        ctx.save();
        ctx.font = '600 12px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const m = ctx.measureText(label);
        ctx.fillStyle = palette.labelHalo;
        ctx.fillRect(mid.x - m.width / 2 - 5, mid.y - 9, m.width + 10, 18);
        ctx.fillStyle = strokeColor;
        ctx.fillText(label, mid.x, mid.y);
        ctx.restore();
      }
    }
  } else if (item.kind === 'warm_front') {
    const color = '#DC2626';
    drawSmoothCurvePath(ctx, pts);
    ctx.strokeStyle = color;
    ctx.lineWidth = item.strokeWidth;
    ctx.stroke();
    for (const s of sampleAlongPolyline(pts, spacing).samples) {
      drawSemicircle(ctx, s.x, s.y, s.tx, s.ty, symSize * 0.9, sideSign, color);
    }
  } else if (item.kind === 'cold_front') {
    const color = '#2563EB';
    drawSmoothCurvePath(ctx, pts);
    ctx.strokeStyle = color;
    ctx.lineWidth = item.strokeWidth;
    ctx.stroke();
    for (const s of sampleAlongPolyline(pts, spacing).samples) {
      drawTriangle(ctx, s.x, s.y, s.tx, s.ty, symSize * 0.78, symSize * 1.35, sideSign, color);
    }
  } else if (item.kind === 'stationary_front') {
    const warmColor = '#DC2626', coldColor = '#2563EB';
    const { samples } = sampleAlongPolyline(pts, spacing);
    drawSmoothCurvePath(ctx, pts);
    ctx.strokeStyle = warmColor;
    ctx.lineWidth = item.strokeWidth;
    ctx.stroke();
    if (samples.length > 0) {
      drawSmoothCurvePath(ctx, pts);
      ctx.strokeStyle = coldColor;
      ctx.lineWidth = item.strokeWidth;
      ctx.setLineDash([spacing, spacing]);
      ctx.stroke();
      ctx.setLineDash([]);
      samples.forEach((s, idx) => {
        if (idx % 2 === 0) drawSemicircle(ctx, s.x, s.y, s.tx, s.ty, symSize * 0.88, sideSign, warmColor);
        else drawTriangle(ctx, s.x, s.y, s.tx, s.ty, symSize * 0.76, symSize * 1.32, -sideSign, coldColor);
      });
    }
  } else if (item.kind === 'occluded_front') {
    const color = '#7C3AED';
    drawSmoothCurvePath(ctx, pts);
    ctx.strokeStyle = color;
    ctx.lineWidth = item.strokeWidth;
    ctx.stroke();
    sampleAlongPolyline(pts, spacing).samples.forEach((s, idx) => {
      if (idx % 2 === 0) drawSemicircle(ctx, s.x, s.y, s.tx, s.ty, symSize * 0.88, sideSign, color);
      else drawTriangle(ctx, s.x, s.y, s.tx, s.ty, symSize * 0.76, symSize * 1.32, sideSign, color);
    });
  } else if (item.kind === 'trough') {
    drawSmoothCurvePath(ctx, pts);
    ctx.strokeStyle = item.color || '#B45309';
    ctx.lineWidth = Math.max(2.5, item.strokeWidth);
    ctx.setLineDash([12, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (item.kind === 'arrow') {
    const color = item.color || '#0F766E';
    drawSmoothCurvePath(ctx, pts);
    ctx.strokeStyle = color;
    ctx.lineWidth = item.strokeWidth;
    if (item.lineStyle === 'dashed') ctx.setLineDash([7, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    const n = pts.length, end = pts[n - 1], prev = pts[Math.max(0, n - 4)];
    const angle = Math.atan2(end.y - prev.y, end.x - prev.x);
    const headLen = 10 + item.strokeWidth * 1.8;
    ctx.save();
    ctx.translate(end.x, end.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(2, 0);
    ctx.lineTo(-headLen, -headLen * 0.48);
    ctx.lineTo(-headLen * 0.72, 0);
    ctx.lineTo(-headLen, headLen * 0.48);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  } else if (item.kind === 'pen') {
    drawSmoothCurvePath(ctx, pts);
    ctx.strokeStyle = item.color || '#0F172A';
    ctx.lineWidth = item.strokeWidth;
    if (item.lineStyle === 'dashed') ctx.setLineDash([8, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function renderStampItem(ctx, item, baseMap, isSelected = false) {
  const palette = MAP_THEMES[baseMap.theme];
  ctx.save();
  ctx.translate(item.x, item.y);
  ctx.scale(item.scale, item.scale);

  if (isSelected) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.strokeStyle = '#0EA5E9';
    ctx.lineWidth = 1.5 / item.scale;
    ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.fillStyle = 'rgba(14, 165, 233, 0.1)';
    ctx.fill();
    ctx.restore();
  }

  if (item.kind === 'high' || item.kind === 'low' || item.kind === 'td') {
    const labelMap = {
      high: item.labelStyle === 'ja' ? '高' : 'H',
      low: item.labelStyle === 'ja' ? '低' : 'L',
      td: item.labelStyle === 'ja' ? '熱' : 'TD',
    };
    const defaultColors = { high: '#2563EB', low: '#DC2626', td: '#0284C7' };
    const color = item.color || defaultColors[item.kind];
    const mainLabel = labelMap[item.kind];

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.3;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(-4, 16); ctx.lineTo(4, 16);
    ctx.moveTo(0, 12); ctx.lineTo(0, 20);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.font = item.labelStyle === 'ja'
      ? '700 28px "IBM Plex Sans JP", sans-serif'
      : '700 30px "Plus Jakarta Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = palette.labelHalo;
    ctx.strokeText(mainLabel, 0, -2);
    ctx.fillStyle = color;
    ctx.fillText(mainLabel, 0, -2);

    if (item.pressure && item.pressure.trim()) {
      ctx.font = '600 12.5px "JetBrains Mono", monospace';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = palette.labelHalo;
      ctx.strokeText(item.pressure.trim(), 0, 29);
      ctx.fillStyle = color;
      ctx.fillText(item.pressure.trim(), 0, 29);
    }
    if (item.movementText && item.movementText.trim()) {
      const yOffset = item.pressure && item.pressure.trim() ? 43 : 29;
      ctx.font = '500 10.5px "IBM Plex Sans JP", sans-serif';
      ctx.lineWidth = 3;
      ctx.strokeStyle = palette.labelHalo;
      ctx.strokeText(item.movementText.trim(), 0, yOffset);
      ctx.fillStyle = palette.cityText;
      ctx.fillText(item.movementText.trim(), 0, yOffset);
    }
  } else if (item.kind === 'typhoon') {
    const color = item.color || '#059669';
    ctx.save();
    ctx.strokeStyle = palette.labelHalo;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, -2, 8.5, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(0, -2, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4, -9); ctx.quadraticCurveTo(13, -15, 16, -21);
    ctx.moveTo(-4, 5); ctx.quadraticCurveTo(-13, 11, -16, 17);
    ctx.stroke();
    ctx.restore();

    const subLabel = item.labelStyle === 'ja' ? '台' : 'T';
    ctx.font = '700 13px "IBM Plex Sans JP", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = palette.labelHalo;
    ctx.strokeText(subLabel, 21, -2);
    ctx.fillStyle = color;
    ctx.fillText(subLabel, 21, -2);

    if (item.pressure && item.pressure.trim()) {
      ctx.font = '600 12.5px "JetBrains Mono", monospace';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = palette.labelHalo;
      ctx.strokeText(item.pressure.trim(), 0, 22);
      ctx.fillStyle = color;
      ctx.fillText(item.pressure.trim(), 0, 22);
    }
    if (item.movementText && item.movementText.trim()) {
      const yOffset = item.pressure && item.pressure.trim() ? 36 : 22;
      ctx.font = '500 10.5px "IBM Plex Sans JP", sans-serif';
      ctx.lineWidth = 3;
      ctx.strokeStyle = palette.labelHalo;
      ctx.strokeText(item.movementText.trim(), 0, yOffset);
      ctx.fillStyle = palette.cityText;
      ctx.fillText(item.movementText.trim(), 0, yOffset);
    }
  } else if (item.kind === 'weather_sunny') {
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fillStyle = palette.labelHalo; ctx.fill();
    ctx.strokeStyle = '#EA580C'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 11, Math.sin(a) * 11);
      ctx.lineTo(Math.cos(a) * 15.5, Math.sin(a) * 15.5);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, 7.8, 0, Math.PI * 2);
    ctx.fillStyle = '#FB923C'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#EA580C'; ctx.stroke();
    ctx.restore();
  } else if (item.kind === 'weather_cloudy') {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-10, 9); ctx.lineTo(11, 9);
    ctx.arc(11, 2.5, 6.5, Math.PI / 2, -Math.PI / 2, true);
    ctx.arc(2, -3.5, 8.5, 0, Math.PI * 1.15, true);
    ctx.arc(-9.5, 2, 7, -Math.PI * 0.55, Math.PI / 2, true);
    ctx.closePath();
    ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = palette.labelHalo; ctx.stroke();
    ctx.fillStyle = '#CBD5E1'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#475569'; ctx.stroke();
    ctx.restore();
  } else if (item.kind === 'weather_partly') {
    ctx.save();
    ctx.beginPath(); ctx.arc(-7, -6, 11, 0, Math.PI * 2); ctx.fillStyle = palette.labelHalo; ctx.fill();
    ctx.strokeStyle = '#EA580C'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4;
      ctx.beginPath();
      ctx.moveTo(-7 + Math.cos(a) * 7.5, -6 + Math.sin(a) * 7.5);
      ctx.lineTo(-7 + Math.cos(a) * 10.5, -6 + Math.sin(a) * 10.5);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(-7, -6, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = '#FB923C'; ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-7, 11); ctx.lineTo(12, 11);
    ctx.arc(12, 5.5, 5.5, Math.PI / 2, -Math.PI / 2, true);
    ctx.arc(4, 0, 7, 0, Math.PI * 1.15, true);
    ctx.arc(-6.5, 5, 5.8, -Math.PI * 0.55, Math.PI / 2, true);
    ctx.closePath();
    ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = palette.labelHalo; ctx.stroke();
    ctx.fillStyle = '#F1F5F9'; ctx.fill();
    ctx.lineWidth = 1.9; ctx.strokeStyle = '#475569'; ctx.stroke();
    ctx.restore();
  } else if (item.kind === 'weather_rain') {
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fillStyle = palette.labelHalo; ctx.fill();
    ctx.strokeStyle = '#1E3A8A'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, -15.5); ctx.lineTo(0, 10.5);
    ctx.arc(-3.5, 10.5, 3.5, 0, Math.PI, false); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 14, Math.PI, 0, false);
    ctx.quadraticCurveTo(9, -3.5, 5, 0); ctx.quadraticCurveTo(0, -3.5, -5, 0); ctx.quadraticCurveTo(-9, -3.5, -14, 0);
    ctx.closePath(); ctx.fillStyle = '#0284C7'; ctx.fill();
    ctx.lineWidth = 1.8; ctx.strokeStyle = '#0369A1'; ctx.stroke();
    ctx.fillStyle = '#38BDF8';
    for (const [rx, ry] of [[-11, 7], [10, 8]]) {
      ctx.beginPath(); ctx.moveTo(rx, ry - 3.5);
      ctx.quadraticCurveTo(rx + 2.8, ry + 1, rx, ry + 3);
      ctx.quadraticCurveTo(rx - 2.8, ry + 1, rx, ry - 3.5);
      ctx.fill();
    }
    ctx.restore();
  } else if (item.kind === 'weather_snow') {
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI * 2); ctx.fillStyle = palette.labelHalo; ctx.fill();
    ctx.strokeStyle = '#0284C7'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI) / 3, cos = Math.cos(a), sin = Math.sin(a);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(cos * 14, sin * 14); ctx.stroke();
      const bx = cos * 9, by = sin * 9, a1 = a + Math.PI / 5, a2 = a - Math.PI / 5;
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a1) * 4.2, by + Math.sin(a1) * 4.2);
      ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a2) * 4.2, by + Math.sin(a2) * 4.2);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#E0F2FE'; ctx.fill(); ctx.stroke();
    ctx.restore();
  } else if (item.kind === 'weather_thunder') {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-9.5, 4); ctx.lineTo(10.5, 4);
    ctx.arc(10.5, -1.5, 5.5, Math.PI / 2, -Math.PI / 2, true);
    ctx.arc(2, -7, 7.5, 0, Math.PI * 1.15, true);
    ctx.arc(-9, -2, 6, -Math.PI * 0.55, Math.PI / 2, true);
    ctx.closePath();
    ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = palette.labelHalo; ctx.stroke();
    ctx.fillStyle = '#64748B'; ctx.fill();
    ctx.lineWidth = 1.8; ctx.strokeStyle = '#334155'; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(1.5, 0.5); ctx.lineTo(-4, 9); ctx.lineTo(0.5, 9);
    ctx.lineTo(-2, 17); ctx.lineTo(6.5, 7); ctx.lineTo(1.8, 7);
    ctx.closePath();
    ctx.lineWidth = 3; ctx.strokeStyle = palette.labelHalo; ctx.stroke();
    ctx.fillStyle = '#FACC15'; ctx.fill();
    ctx.lineWidth = 1.1; ctx.strokeStyle = '#CA8A04'; ctx.stroke();
    ctx.restore();
  } else if (item.kind === 'text') {
    const content = item.text || 'メモ';
    const color = item.color || palette.isobarDefault;
    ctx.font = '600 15px "IBM Plex Sans JP", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = palette.labelHalo;
    ctx.strokeText(content, 0, 0);
    ctx.fillStyle = color;
    ctx.fillText(content, 0, 0);
  }

  if (item.kind.startsWith('weather_') && item.text && item.text.trim()) {
    ctx.font = '600 11.5px "IBM Plex Sans JP", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3.5;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = palette.labelHalo;
    ctx.strokeText(item.text.trim(), 0, 27);
    ctx.fillStyle = palette.cityText;
    ctx.fillText(item.text.trim(), 0, 27);
  }
  ctx.restore();
}

function renderWeatherChart(ctx, state, options) {
  const scale = (options && options.scale) ?? 1;
  ctx.save();
  ctx.scale(scale, scale);
  renderBaseMap(ctx, state.baseMap);
  for (const layer of state.layers) {
    if (!layer.visible) continue;
    ctx.save();
    ctx.globalAlpha = layer.opacity;
    for (const item of layer.items) {
      const isSelected = options && options.selectedItemId === item.id;
      if (item.itemType === 'stroke') renderStrokeItem(ctx, item, state.baseMap, isSelected);
      else renderStampItem(ctx, item, state.baseMap, isSelected);
    }
    ctx.restore();
  }
  if (options && options.previewStroke) renderStrokeItem(ctx, options.previewStroke, state.baseMap, false);
  renderChartHeader(ctx, state.baseMap);
  ctx.restore();
}

function generateSnapshotThumbnail(state) {
  const thumbW = 320, thumbH = 240;
  const canvas = document.createElement('canvas');
  canvas.width = thumbW;
  canvas.height = thumbH;
  const ctx = canvas.getContext('2d');
  if (!ctx) return '';
  renderWeatherChart(ctx, state, { scale: thumbW / CHART_WIDTH });
  return canvas.toDataURL('image/jpeg', 0.75);
}

function distToSegment(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}

function hitTestItem(item, pt, tolerance = 14) {
  if (item.itemType === 'stamp') {
    const r = Math.max(24, 28 * item.scale) + tolerance * 0.4;
    return Math.hypot(pt.x - item.x, pt.y - item.y) <= r;
  }
  const pts = item.points;
  for (let i = 0; i < pts.length - 1; i++) {
    if (distToSegment(pt, pts[i], pts[i + 1]) <= tolerance) return true;
  }
  return false;
}

// === 3. Preset Charts ===
function ptsFromLonLat(coords) {
  return smoothPolyline(coords.map(([lon, lat]) => projectLonLat(lon, lat)), 8);
}
function makePresetId(prefix) {
  return `${prefix}_${Math.random().toString(36).slice(2, 9)}`;
}

    },

}

// === 5. TopBar ===
const TopBar = ({ canUndo, canRedo, onUndo, onRedo, onSaveSnapshot, onLoadPreset, onClearCanvas, onOpenExport }) => {
  const [presetOpen, setPresetOpen] = useState(false);
  const menuRef = useRef(null);

  useEffect(() => {
    const handleClickOutside = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) setPresetOpen(false);
    };
    if (presetOpen) document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, [presetOpen]);

  return (
    <header className="h-14 bg-white border-b border-slate-200 px-5 flex items-center justify-between gap-8 shrink-0 z-30">
      <span className="font-display text-lg font-bold tracking-tight text-slate-900 whitespace-nowrap shrink-0">
        天気図スタジオ
      </span>
      <nav className="flex items-center gap-5 text-sm font-medium text-slate-600">
        <div className="relative" ref={menuRef}>
          <button
            type="button"
            onClick={() => setPresetOpen((v) => !v)}
            className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-slate-700 hover:text-slate-900 hover:bg-slate-100 transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-sky-600"
          >
            <span>テンプレート</span>
            <UiIcon name="chevronDown" className="w-3.5 h-3.5 text-slate-400" />
          </button>
          {presetOpen && (
            <div className="absolute left-0 top-full mt-1.5 w-80 bg-white border border-slate-200 rounded-lg shadow-lg py-1.5 z-50">
              <div className="px-3 py-1.5 text-xs font-medium text-slate-400 border-b border-slate-100">
                気圧配置のテンプレートを読み込む
              </div>
              {CHART_PRESETS.map((preset) => (
                <button
                  key={preset.id}
                  type="button"
                  onClick={() => { onLoadPreset(preset); setPresetOpen(false); }}
                  className="w-full text-left px-3 py-2.5 hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-b-0"
                >
                  <div className="text-sm font-semibold text-slate-800">{preset.name}</div>
                  <div className="text-xs text-slate-500 mt-0.5 leading-snug">{preset.subtitle}</div>
                </button>
              ))}
            </div>
          )}
        </div>
        <button
          type="button" onClick={onUndo} disabled={!canUndo} title="元に戻す (Ctrl+Z)"
          className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md hover:text-slate-900 hover:bg-slate-100 disabled:opacity-35 disabled:pointer-events-none transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-sky-600"
        >
          <UiIcon name="undo" /><span>元に戻す</span>
        </button>
        <button
          type="button" onClick={onRedo} disabled={!canRedo} title="やり直し (Ctrl+Shift+Z)"
          className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md hover:text-slate-900 hover:bg-slate-100 disabled:opacity-35 disabled:pointer-events-none transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-sky-600"
        >
          <UiIcon name="redo" /><span>やり直し</span>
        </button>
        <button
          type="button" onClick={onSaveSnapshot} title="現在の描画状態をブラウザ履歴に保存"
          className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-slate-700 hover:text-sky-700 hover:bg-sky-50 transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-sky-600"
        >
          <UiIcon name="bookmarkPlus" /><span>履歴を保存</span>
        </button>
        <button
          type="button" onClick={onClearCanvas} title="すべてのレイヤーを白紙に戻す"
          className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-slate-600 hover:text-rose-700 hover:bg-rose-50 transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-sky-600"
        >
          <UiIcon name="filePlus" /><span>白紙にする</span>
        </button>
      </nav>
      <div className="flex items-center shrink-0">
        <button
          type="button" onClick={onOpenExport}
          className="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-sky-700 hover:bg-sky-800 rounded-lg transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600"
        >
          <UiIcon name="download" /><span>画像として保存</span>
        </button>
      </div>
    </header>
  );
};

// === 6. ToolSidebar ===
const TOOL_GROUPS = [
  {
    title: '基本操作',
    tools: [
      { id: 'select', label: '選択・移動', icon: <UiIcon name="pointer" />, shortcut: 'V' },
      { id: 'eraser', label: '消しゴム', icon: <UiIcon name="eraser" />, shortcut: 'E' },
    ],
  },
  {
    title: '等圧線・補助線',
    tools: [
      { id: 'isobar', label: '等圧線', icon: <IsobarIcon />, shortcut: 'I' },
      { id: 'trough', label: '気圧の谷', icon: <TroughIcon /> },
      { id: 'arrow', label: '進行矢印', icon: <UiIcon name="arrowUpRight" /> },
      { id: 'pen', label: '自由ペン', icon: <UiIcon name="penTool" /> },
    ],
  },
  {
    title: '前線',
    tools: [
      { id: 'warm_front', label: '温暖前線', icon: <WarmFrontIcon /> },
      { id: 'cold_front', label: '寒冷前線', icon: <ColdFrontIcon /> },
      { id: 'stationary_front', label: '停滞前線', icon: <StationaryFrontIcon /> },
      { id: 'occluded_front', label: '閉塞前線', icon: <OccludedFrontIcon /> },
